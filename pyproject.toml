[project]
name = "t"
version = "0.1.0"
description = "CLI, které zařadí úkol do správného Trello listu"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2",
    "dateparser>=1.2",
    "types-dateparser>=1.2",
    "python-dotenv>=1.0",
    "tomli-w>=1.1",
    "mcp>=2.2.0",
]

[project.scripts]
t = "t.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["t"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
# PLAN.md is the task spec: never reformat code samples inside it.
exclude = ["PLAN.md"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
